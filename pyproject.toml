[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "company-financials"
version = "0.1.0"
description = "Extract structured Norwegian company financials locally for quality checking"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.12",
    "fastapi>=0.115",
    "httpx>=0.27",
    "lxml>=5.0",
    "pandas>=2.0",
    "pydantic>=2.0",
    "streamlit>=1.40",
    "tenacity>=8.0",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-httpx>=0.30"]

[project.scripts]
company-financials = "company_financials.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/company_financials"]

[tool.hatch.build.targets.wheel.sources]
"src" = ""

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
